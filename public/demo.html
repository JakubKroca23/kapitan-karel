<!DOCTYPE html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kapitán Karel — demo chat widget</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Segoe UI", system-ui, sans-serif;
        background:
          radial-gradient(ellipse at 15% 0%, rgba(47, 111, 237, 0.22) 0%, transparent 45%),
          #1a1d22;
        color: #ffffff;
      }
      main {
        max-width: 640px;
        margin: 0 auto;
        padding: 64px 24px;
      }
      h1 {
        font-size: clamp(2rem, 5vw, 3rem);
        font-weight: 600;
        letter-spacing: -0.02em;
        margin: 0 0 12px;
      }
      p {
        font-size: 1.1rem;
        line-height: 1.6;
        color: #a8aeb8;
        max-width: 36ch;
      }
      code {
        font-family: ui-monospace, monospace;
        font-size: 0.9em;
        background: #2b2f36;
        color: #ffffff;
        padding: 2px 6px;
        border-radius: 4px;
        border: 1px solid #3a404a;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Kapitán Karel</h1>
      <p>
        Ukázková stránka s embeddable chat widgetem napojeným na lokální
        Ollama. Otevřete bublinu vpravo dole.
      </p>
      <p>
        Vložení: <code>&lt;script src="…/widget.js" data-api="…"&gt;</code>
      </p>
    </main>

    <script
      src="/widget.js"
      data-model="qwen2.5:3b"
      data-title="Kapitán Karel"
      data-system="Jsi Kapitán Karel, přátelský pirátský robot-asistent za volantem. Odpovídej stručně česky."
      async
    ></script>
  </body>
</html>
